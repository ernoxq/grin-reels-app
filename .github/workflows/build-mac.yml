name: Build Mac app (DMG)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["autocut/**", "web/**", "library/**", "styles/**", "packaging/**", "requirements.txt", ".github/workflows/build-mac.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and DMG
        run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GRIN-Reels-dmg
          path: dist/GRIN-Reels.dmg
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: GRIN Reels для Mac
          body: |
            Скачай **GRIN-Reels.dmg**, открой и перетащи GRIN Reels в «Программы».
            Первый запуск: правый клик по приложению → Открыть → Открыть.
          files: dist/GRIN-Reels.dmg
          make_latest: true
