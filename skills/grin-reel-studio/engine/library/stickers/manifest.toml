# Folder defaults apply to every file below this folder; [files."name.png"] overrides one file.
# `triggers` = spoken words (lower-case, no punctuation) that summon the sticker.

[defaults]
scale = 0.35

[files."fire.png"]
tags = ["emoji", "energy"]
triggers = ["огонь", "fire", "foc", "круто"]

[files."money.png"]
tags = ["emoji"]
triggers = ["деньги", "money", "bani", "доход"]
