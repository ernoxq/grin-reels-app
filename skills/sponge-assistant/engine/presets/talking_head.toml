# Preset = all the "creative decisions" as data. No LLM at runtime.
# Copy this file per style (reels_fast.toml, podcast_calm.toml, ...).

[asr]
model = "small"        # tiny | base | small | medium  (8 GB Mac: small is the sweet spot)
language = "ru"        # or "en", "ro", ... ; omit for auto-detect

[cut]
vad = "ffmpeg"         # "ffmpeg" (zero deps) | "silero" (better in noisy rooms)
noise_db = -35         # louder room -> raise toward -30
min_silence = 0.45     # pauses longer than this get cut
pad = 0.12             # breathing room kept on each side of speech
min_keep = 0.20        # drop micro-fragments
remove_fillers = true
fillers = ["ээ", "эм", "мм", "um", "uh", "uhm", "ăă", "îî"]

[sfx]
enabled = true
on_cut_tag = "whoosh"  # library/sfx/whoosh/*
cooldown = 4.0         # at most one cut-sfx every 4 s
gain = 0.45
lead = 0.08
max_len = 1.2

[captions]
enabled = true
mode = "text"          # "text" = editable CapCut text | "png" = exact custom font, burned PNGs
max_words = 3
max_chars = 18
uppercase = true
[captions.style]
font = "fonts/Montserrat-Black"   # library id (path under library/ without extension)
font_name = "Montserrat Black"    # family name, used by preview renderer
size = 9.0
bold = true
color = "#FFFFFF"
stroke = true
stroke_color = "#000000"
y = -0.55                         # CapCut units: -1 bottom .. 1 top

[stickers]
enabled = true
cooldown = 3.0
duration = 1.4
x = 0.55
y = 0.45
scale = 0.35
anim = "pop"
sfx_tag = "pop"

[music]
enabled = false
tag = "lofi"
gain = 0.35
duck_gain = 0.10

[color]
lut = ""               # e.g. "luts/warm_film"
bake = false           # true = render graded ProRes intermediate; false = apply LUT in CapCut
